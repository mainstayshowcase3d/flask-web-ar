<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MES Fire | Revolver Fill Station</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .button-container-top {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 1000;
        }

        .ar-button, .copy-button, .share-button {
            padding: 12px 20px;
            border: none;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .ar-button {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
        }

        .copy-button {
            background: linear-gradient(45deg, #4ecdc4, #45b7b8);
            color: white;
            box-shadow: 0 4px 15px rgba(78, 205, 196, 0.4);
        }

        .share-button {
            background: linear-gradient(45deg, #a55eea, #8e44ad);
            color: white;
            box-shadow: 0 4px 15px rgba(165, 94, 234, 0.4);
        }

        .ar-button:hover, .copy-button:hover, .share-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .model-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 80px 20px 20px;
        }

        model-viewer {
            width: 90%;
            height: 70vh;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .footer {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .footer-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .qr-code {
            width: 80px;
            height: 80px;
            border-radius: 10px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            flex-shrink: 0;
        }

        .footer-text {
            color: white;
            text-align: left;
        }

        .footer-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 8px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .footer-tagline {
            font-size: 16px;
            color: #e0e0e0;
            margin-bottom: 12px;
            font-style: italic;
        }

        .footer-link {
            color: #4ecdc4;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s ease;
            display: block;
            margin-bottom: 8px;
        }

        .footer-link:hover {
            color: #ff6b6b;
        }

        .footer-line {
            font-size: 12px;
            color: #b0b0b0;
            margin-bottom: 4px;
        }

        .footer-copyright {
            font-size: 10px;
            color: #888;
            margin-top: 8px;
        }

        @media (max-width: 768px) {
            .button-container-top {
                flex-direction: column;
                align-items: center;
            }

            .footer-content {
                flex-direction: column;
                gap: 20px;
                text-align: center;
            }

            .footer-text {
                text-align: center;
            }

            .footer-title {
                font-size: 20px;
            }

            .qr-code {
                width: 60px;
                height: 60px;
            }

            model-viewer {
                width: 95%;
                height: 60vh;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="button-container-top">
            <!-- Custom Activate AR Button -->
            <button id="ar-button" class="ar-button" onclick="triggerAR()">✨ ACTIVATE AR ✨</button>

            <!-- Copy Link and Share Buttons -->
            <button class="copy-button" onclick="copyLink()">📋 Copy Link</button>
            <button class="share-button" onclick="shareLink()">📤 Share</button>
        </div>

        <div class="model-container">
            <!-- Model Viewer -->
            <model-viewer id="model-viewer"
                          src="./RevolveAir_fillStation_v23.glb"
                          ios-src="./RevolveAir_fillStation_v23.usdz"
                          alt="Revolver Fill Station"
                          shadow-intensity="1.5"
                          camera-controls
                          min-camera-orbit="auto 0deg 2m"
                          max-camera-orbit="auto 95deg 5m"
                          camera-target="0m .8m 0m"
                          auto-rotate
                          loading="lazy"
                          reveal="auto"
                          ar
                          autoplay
                          ar-scale="fixed">
                <button slot="ar-button" id="hidden-ar-button" style="display: none;"></button>
            </model-viewer>
        </div>

        <!-- Footer with QR Code and Text -->
        <footer class="footer">
            <div class="footer-content">
                <img src="fillstation.png" alt="QR Code" class="qr-code">
                <div class="footer-text">
                    <h1 class="footer-title">MES Fire | Revolver Fill Station</h1>
                    <p class="footer-tagline">Fast, reliable SCBA cylinder refilling for high-performance teams.</p>
                    <a href="https://www.mainstaydigital3d.com/mesfire/revolveair" target="_blank" class="footer-link">
                        Visit MES Fire to learn more about this product.
                    </a>
                    <p class="footer-line">Augmented Reality only available on compatible devices.</p>
                    <p class="footer-copyright">COPYRIGHT ©2025 MES FIRE ALL RIGHTS RESERVED.</p>
                </div>
            </div>
        </footer>
    </div>

    <!-- Model Viewer Scripts -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <script nomodule src="https://unpkg.com/@google/model-viewer/dist/model-viewer-legacy.js"></script>

    <!-- JavaScript to Detect Device and Set Camera Orbit -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const modelViewer = document.getElementById('model-viewer');
            const arButton = document.getElementById('ar-button');

            // Function to detect if the device is mobile
            function isMobileDevice() {
                const userAgent = navigator.userAgent || navigator.vendor || window.opera;
                const isMobilePlatform = /Android|iPhone|iPad|iPod/i.test(userAgent);
                const isiPadOS = navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;

                return isMobilePlatform || isiPadOS;
            }

            // Apply camera-orbit settings and show/hide AR button based on detection
            if (isMobileDevice()) {
                arButton.style.display = 'inline-flex'; // Show the button on mobile
                modelViewer.setAttribute('camera-orbit', '-35deg 75deg 5m');
            } else {
                arButton.style.display = 'none'; // Hide the button on desktop
                modelViewer.setAttribute('camera-orbit', '-35deg 75deg 5m');
            }
        });

        // Trigger AR via the hidden button in model-viewer
        function triggerAR() {
            const hiddenARButton = document.getElementById('hidden-ar-button');
            hiddenARButton.click(); // Trigger the hidden AR button
        }

        // Copy link to clipboard
        function copyLink() {
            const preferredLink = 'https://www.mainstaydigital3d.com/mesfire/revolveair/index.html';
            navigator.clipboard.writeText(preferredLink).then(() => {
                alert('Link copied to clipboard!');
            }).catch(err => {
                console.error('Failed to copy: ', err);
            });
        }

        // Share link via Web Share API
        function shareLink() {
            const preferredLink = 'https://www.mainstaydigital3d.com/mesfire/revolveair/index.html';
            if (navigator.share) {
                navigator.share({
                    title: 'MES Fire - Revolver Fill Station',
                    text: 'Check out this cool product!',
                    url: preferredLink
                }).then(() => {
                    console.log('Thanks for sharing!');
                }).catch((error) => {
                    console.error('Error sharing:', error);
                });
            } else {
                alert('Sharing is not supported on this device. Please copy the link instead.');
            }
        }
    </script>
</body>
</html>
